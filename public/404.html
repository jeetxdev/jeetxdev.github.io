<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#123a75" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <title>Not found · Jeet Mukherjee</title>

    <style>
      /* public/ is served as is, so this page loads its font files directly. */
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/barlow-condensed-latin-600-normal.woff2") format("woff2");
      }

      /* Same palette and drafting grid as src/styles/index.css. */
      :root {
        --paper: #123a75;
        --ink: #eaf2ff;
        --muted: #a9c1e8;
        --accent: #ffd166;
        --grid-major: rgb(234 242 255 / 0.13);
        --grid-minor: rgb(234 242 255 / 0.05);
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        background-color: var(--paper);
        background-image:
          linear-gradient(var(--grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
          linear-gradient(var(--grid-minor) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
        background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
        color: var(--ink);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.875rem;
        line-height: 1.5;
      }

      main {
        max-width: 36rem;
        width: 100%;
        box-sizing: border-box;
        border: 2px solid var(--ink);
        padding: 2rem;
      }

      .label {
        margin: 0;
        color: var(--muted);
        font-size: 0.8125rem;
        text-transform: uppercase;
      }

      h1 {
        margin: 1rem 0 1.5rem;
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
        font-size: 4.5rem;
        font-weight: 600;
        line-height: 0.92;
        text-transform: uppercase;
      }

      p {
        margin: 0;
      }

      #path {
        color: var(--accent);
        word-break: break-all;
      }

      .back {
        margin-top: 1.5rem;
      }

      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 0.22em;
      }

      a:hover {
        text-decoration-thickness: 2px;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Error 404 · Sheet not found</p>
      <h1>No drawing<br />at this address.</h1>
      <p>Requested: <span id="path">this page</span></p>
      <p class="back"><a href="/">Return to sheet 1</a></p>
    </main>
    <script>
      document.getElementById("path").textContent = location.pathname;
    </script>
  </body>
</html>
