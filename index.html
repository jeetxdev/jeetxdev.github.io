<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060912" />
    <meta
      name="description"
      content="Jeet Mukherjee - senior full-stack developer in Bangalore, India. Eleven years shipping React/Node platforms for fintech and developer tooling."
    />
    <meta
      property="og:title"
      content="Jeet Mukherjee - Senior Full-Stack Developer"
    />
    <meta
      property="og:description"
      content="Eleven years of making the whole stack behave. React, Node, and API platforms for fintech and banking."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Jeet Mukherjee - Senior Full-Stack Developer</title>

    <!-- Resolves the theme before first paint so a stored light choice never
         flashes the dark palette. The storage key and attribute are duplicated
         from src/lib/theme.ts because this has to run ahead of the bundle. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("jeetxdev-theme");
          theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch {
          /* Blocked storage: fall through to the dark default. */
        }
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "light" ? "#f4f7fc" : "#060912");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
