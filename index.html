    <!-- Resolves the theme before first paint so a stored choice never
         flashes the wrong palette. The storage key and attribute are duplicated
         from src/lib/theme.ts because this has to run ahead of the bundle. -->
    <script>
      (function () {
        /* A stored choice wins. Otherwise the system preference decides. */
        var theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        try {
          var stored = localStorage.getItem("jeetxdev-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch {
          /* Blocked storage: keep the system preference. */
        }
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "light" ? "#faf8f5" : "#131209");
      })();
    </script>
